<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Login Page</title>
    <!-- Load Tailwind CSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- START OF CUSTOM CSS --- */
        /* Custom styles for the body: Centering and applying the green gradient */
        body {
            font-family: 'Inter', sans-serif;
            /* Flex properties for centering */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Use min-height for better compatibility */
            margin: 0;
            padding: 1rem;
            /* Green Gradient Background */
            background: linear-gradient(135deg, #34d399, #10b981); /* from-emerald-400 to-green-600 */
        }
        /* --- END OF CUSTOM CSS --- */
    </style>
</head>
<body>
    
    <!-- Main Login Card Container: Uses Tailwind classes for styling the white card -->
    <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-2xl">
        <h2 class="text-3xl font-extrabold text-center mb-6 text-gray-800">Log In</h2>
        
        <!-- Added id="loginForm" for JavaScript to target -->
        <form id="loginForm" class="space-y-6">
            
            <!-- Username Input Field -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <!-- Added Tailwind classes for input styling and green focus effect -->
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150 ease-in-out"
                    placeholder="Enter your username"
                >
            </div>

            <!-- Password Input Field -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <!-- Added Tailwind classes for input styling and green focus effect -->
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150 ease-in-out"
                    placeholder="••••••••"
                >
            </div>

            <!-- Submission Status Message Box (Added for JavaScript feedback) -->
            <div id="messageBox" class="hidden p-3 text-sm rounded-lg" role="alert">
                <!-- Message will be inserted here by JavaScript -->
            </div>

            <!-- Login Button -->
            <!-- Added Tailwind classes for button styling, hover effects, and green theme -->
            <button
                type="submit"
                class="w-full py-2 px-4 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg shadow-md transition duration-200 ease-in-out transform hover:scale-[1.01] focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50"
            >
                Login
            </button>
        </form>
        
        <!-- Added a simple footer link -->
        <div class="mt-6 text-center">
            <a href="#" class="text-sm text-green-600 hover:text-green-800 hover:underline">Forgot Password?</a>
        </div>
    </div>
