<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Login Page</title>
    <!-- Load Tailwind CSS from CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            background: linear-gradient(135deg, #34d399, #10b981);
        }
        .sticky-note {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px; /* Fixed height for consistent flip */
            perspective: 1000px; /* CRITICAL: Adds the 3D depth to the container */
            z-index: 100;
            transform: rotate(3deg); /* Slight rotation for a classic sticky note look */
            /* Removed cursor: pointer from the container */
        }

        .sticky-note-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s; /* Animation speed */
            transform-style: preserve-3d; /* CRITICAL: Allows child elements to be positioned in 3D space */
        }

        /* Class added by JS to trigger the flip */
        .sticky-note-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .sticky-note-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* CRITICAL: Hides the back side until it's flipped */
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            padding: 15px 20px;
            font-size: 0.9rem;
            color: #333;
            line-height: 1.3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Front side (Default view) */
        .sticky-note-front {
            background-color: #ffeb3b; /* Yellow sticky note color */
        }

        /* Back side (The credentials) */
        .sticky-note-back {
            background-color: #f7ff93; /* Slightly different yellow for distinction */
            transform: rotateY(180deg); /* Start rotated 180deg */
        }

        /* Styles for the tiny corner button */
        .flip-button {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 25px;
            height: 25px;
            cursor: pointer;
            padding: 0;
            border: none;
            background-color: rgba(255, 255, 255, 0.7); /* Semi-transparent white */
            border-radius: 4px;
            font-size: 14px;
            line-height: 1;
            transition: background-color 0.2s;
        }

        .flip-button:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>

    <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-2xl">
        <h2 class="text-3xl font-extrabold text-center mb-6 text-gray-800">Log In</h2>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150 ease-in-out"
                    placeholder="Enter your username"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition duration-150 ease-in-out"
                    placeholder="••••••••"
                >
            </div>

            <div id="messageBox" class="hidden p-3 text-sm rounded-lg" role="alert"></div>

            <button
                type="submit"
                class="w-full py-2 px-4 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg shadow-md transition duration-200 ease-in-out transform hover:scale-[1.01] focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50"
            >
                Login
            </button>
        </form>

        <!-- Footer trigger -->
        <div id="footerTrigger" class="mt-6 text-center text-sm text-green-600 hover:text-green-800 hover:underline cursor-pointer">
            Forgot Password? (Don't Click)
        </div>

        <!-- Hidden popup footer message -->
        <div id="footerMessage" class="hidden mt-4 p-3 bg-green-100 text-green-800 rounded-lg text-center text-sm">
            I told you not to click it. 🙄
        </div>
    </div>
    <div id="stickyNote" class="sticky-note">
        <div id="stickyNoteInner" class="sticky-note-inner">
            
            <!-- FRONT FACE -->
            <div class="sticky-note-face sticky-note-front">
                <p class="font-bold text-base">Shopping list</p>
                <p class="text-xs mt-2">Tomatoes<br> Potatoes<br> Milk<br> Chocolates</p>
                
                <!-- NEW TINY BUTTON -->
                <button id="flipButton" class="flip-button" title="Test credentials">
                    &#8631; <!-- A simple circular arrow icon -->
                </button>
            </div>
            
            <!-- BACK FACE (Hidden by default) -->
            <div class="sticky-note-face sticky-note-back">
                <p class="font-bold text-base mb-1">Top Secret</p>
                <p class="text-sm">User: Johnnydoe67</p>
                <p class="text-sm">Pass: qwerty </p>
            </div>
            
        </div>
    </div>

    <script>
        // Form Logic
        const loginForm = document.getElementById('loginForm');
        const messageBox = document.getElementById('messageBox');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        
        // Sticky Note Flip Logic (RESTORED)
        const flipButton = document.getElementById('flipButton'); // 1. Get the button
        const stickyNoteInner = document.getElementById('stickyNoteInner'); // 2. Get the inner container

        // Attach event listener to the button
        flipButton.addEventListener('click', (event) => {
            event.stopPropagation(); // Prevents clicks from affecting elements underneath
            stickyNoteInner.classList.toggle('is-flipped'); // 3. Toggle the flip class
        });
        
        // Footer Toggle Logic
        const footerTrigger = document.getElementById("footerTrigger");
        const footerMessage = document.getElementById("footerMessage");
        footerTrigger.addEventListener("click", () => {
            footerMessage.classList.toggle("hidden");
        });

        // Function to show the message box with the appropriate style
        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            
            if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-700');
            } else if (type === 'success') {
                messageBox.classList.add('bg-green-100', 'text-green-700');
            }
        }

        // Add an event listener to the form to handle submission
        loginForm.addEventListener('submit', function(event) {
            event.preventDefault(); // Stop the page from reloading

            messageBox.classList.add('hidden'); // Clear previous messages

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // Test credentials
            const CORRECT_USERNAME = "tester";
            const CORRECT_PASSWORD = "password123";

            if (username === CORRECT_USERNAME && password === CORRECT_PASSWORD) {
                // Successful login (Credentials: tester / password123)
                showMessage("Login successful! Welcome to the dashboard.", 'success');
                
            } else {
                // Failed login
                showMessage("Invalid username or password. Please check your credentials.", 'error');
            }
        });
    </script>
    <!-- --- END OF JAVASCRIPT LOGIN LOGIC --- -->
</body>
</html>
